# Workflow de CI/CD para el proyecto Angular.
# CI: compila en cada PR contra main y en cada push a main.
# CD: si el evento es un push a main y la compilación va bien, despliega en GitHub Pages.
name: Angular CI/CD

# on: indica CUÁNDO se ejecuta el workflow.
#  - pull_request contra main -> se compila el código propuesto antes de fusionarlo.
#  - push a main (por ejemplo, al fusionar una PR) -> se compila y además se despliega.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# jobs: los trabajos que forman el workflow. Cada job se ejecuta en una máquina virtual limpia.
jobs:
  # Job de integración continua: descarga, instala y compila.
  build:
    runs-on: ubuntu-latest
    # permissions: permisos mínimos del token de GitHub. Para compilar solo hace falta leer el repositorio.
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Si hay un error de compilación este paso falla, el job falla y la PR queda bloqueada.
      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/

      # if: solo se sube el artefacto de Pages cuando el evento es un push (en una PR no se publica nada).
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ci-cd/browser

  # Job de despliegue continuo: publica en GitHub Pages lo que ha compilado build.
  deploy:
    # needs: deploy depende de build. Solo empieza si build ha terminado correctamente.
    needs: build
    # if: solo se despliega en un push a la rama main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # permissions: permisos mínimos para desplegar en Pages.
    permissions:
      pages: write      # publicar en GitHub Pages
      id-token: write   # verificar que el despliegue viene de este workflow
    # Entorno github-pages: GitHub muestra aquí la URL de la web publicada.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
